<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie Editor — Layer Editor</title>
    <meta name="description" content="Web-based Lottie animation editor. Move layers, delete layers, change colors.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <div class="logo">
                <img src="logo.jpg" alt="Lottie Editor" class="logo-img">
                <span>Lottie Editor</span>
            </div>
        </div>
        <div class="header-center">
            <span id="file-name" class="file-name-label">No file loaded</span>
        </div>
        <div class="header-right">
            <button id="btn-undo" class="btn btn-secondary" title="Undo (Ctrl+Z)" disabled>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 7h6a3 3 0 010 6H8M4 7l3-3M4 7l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <label id="btn-load" class="btn btn-secondary" tabindex="0">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 10v2a2 2 0 002 2h8a2 2 0 002-2v-2M11 5L8 2 5 5M8 2v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Load
                <input type="file" id="file-input" accept=".json,.tgs" hidden>
            </label>
            <label id="btn-merge" class="btn btn-secondary" tabindex="0" title="Add another Lottie and merge layers">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                Merge
                <input type="file" id="merge-input" accept=".json,.tgs" hidden>
            </label>
            <!-- Export dropdown -->
            <div class="export-dropdown" id="export-dropdown">
                <button id="btn-export" class="btn btn-primary" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 10v2a2 2 0 002 2h8a2 2 0 002-2v-2M5 7l3 3 3-3M8 10V2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Export
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" class="chevron"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="export-menu" id="export-menu">
                    <button class="export-menu-item" id="export-json">
                        <span class="export-icon">{ }</span>
                        <div>
                            <div class="export-menu-title">JSON</div>
                            <div class="export-menu-desc">Lottie animation file</div>
                        </div>
                    </button>
                    <button class="export-menu-item" id="export-tgs">
                        <span class="export-icon">📦</span>
                        <div>
                            <div class="export-menu-title">TGS</div>
                            <div class="export-menu-desc">Telegram Sticker (gzipped)</div>
                        </div>
                    </button>
                    <div class="export-menu-divider"></div>
                    <button class="export-menu-item" id="export-svg">
                        <span class="export-icon">◇</span>
                        <div>
                            <div class="export-menu-title">SVG</div>
                            <div class="export-menu-desc">Current frame as vector</div>
                        </div>
                    </button>
                    <button class="export-menu-item" id="export-png">
                        <span class="export-icon">🖼</span>
                        <div>
                            <div class="export-menu-title">PNG</div>
                            <div class="export-menu-desc">Current frame as image</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main id="app-main">
        <!-- Left panel: Layers -->
        <aside id="layers-panel" class="panel">
            <div class="panel-header">
                <h2>Layers</h2>
                <div style="display:flex;align-items:center;gap:6px">
                    <button id="btn-extend-all" class="btn-extend-all" title="Extend all layers to match animation timeline" disabled>
                        <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M2 7l2-2M2 7l2 2M12 7l-2-2M12 7l-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Extend All
                    </button>
                    <span id="layer-count" class="badge">0</span>
                </div>
            </div>
            <div id="layers-list" class="layers-list">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="6" y="10" width="36" height="28" rx="4" stroke="currentColor" stroke-width="2" opacity=".3"/><path d="M6 18h36M16 10v28" stroke="currentColor" stroke-width="2" opacity=".2"/></svg>
                    <p>Load a Lottie JSON file<br>to see layers</p>
                </div>
            </div>
        </aside>

        <!-- Center: Preview -->
        <section id="preview-section">
            <div id="preview-container" class="preview-container">
                <div id="lottie-player" class="lottie-player"></div>
                <div id="preview-empty" class="empty-state">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" opacity=".2"/><polygon points="26,20 26,44 46,32" stroke="currentColor" stroke-width="2" fill="none" opacity=".3"/></svg>
                    <p>Drop a <strong>.json</strong> or <strong>.tgs</strong> file here<br>or click <strong>Load</strong></p>
                </div>
            </div>
            <!-- Playback controls -->
            <div id="playback-controls" class="playback-controls hidden">
                <button id="btn-play-pause" class="ctrl-btn" title="Play / Pause">
                    <svg id="icon-play" width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="4,2 4,16 15,9" fill="currentColor"/></svg>
                    <svg id="icon-pause" width="18" height="18" viewBox="0 0 18 18" fill="none" class="hidden"><rect x="3" y="2" width="4" height="14" rx="1" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="1" fill="currentColor"/></svg>
                </button>
                <input id="scrubber" type="range" min="0" max="100" value="0" class="scrubber">
                <span id="frame-label" class="frame-label">0 / 0</span>
                <button id="btn-loop" class="ctrl-btn active" title="Loop">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9a7 7 0 0112.5-4.3M16 9a7 7 0 01-12.5 4.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14.5 2v3h-3M3.5 16v-3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
            <div id="trim-controls" class="trim-controls hidden">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="opacity:.5"><path d="M2 4h10M2 10h10M4 2v10M10 2v10" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
                <label class="trim-label">In</label>
                <input type="number" id="trim-in" class="trim-input" value="0" min="0" step="1">
                <label class="trim-label">Out</label>
                <input type="number" id="trim-out" class="trim-input" value="0" min="0" step="1">
                <button id="btn-trim-apply" class="trim-apply-btn" title="Apply trim">✂ Trim</button>
            </div>

            <!-- Timeline (AE-style) -->
            <div id="timeline-panel" class="timeline-panel hidden">
                <div class="timeline-header">
                    <button id="btn-timeline-toggle" class="timeline-toggle" title="Collapse / expand timeline">
                        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <span class="timeline-title">Timeline</span>
                    <span id="timeline-info" class="timeline-info"></span>
                    <div class="timeline-zoom">
                        <button id="tl-zoom-out" class="tl-zoom-btn" title="Zoom out">−</button>
                        <button id="tl-zoom-fit" class="tl-zoom-btn" title="Fit to width">Fit</button>
                        <button id="tl-zoom-in" class="tl-zoom-btn" title="Zoom in">+</button>
                    </div>
                </div>
                <div id="timeline-body" class="timeline-body">
                    <div id="timeline-names" class="timeline-names"></div>
                    <div id="timeline-tracks-wrap" class="timeline-tracks-wrap">
                        <div id="timeline-ruler" class="timeline-ruler"></div>
                        <div id="timeline-tracks" class="timeline-tracks"></div>
                        <div id="timeline-playhead" class="timeline-playhead"><div class="timeline-playhead-head"></div></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right panel: Inspector -->
        <aside id="inspector-panel" class="panel">
            <div class="panel-header inspector-tabs">
                <button class="inspector-tab active" data-tab="colors">Colors</button>
                <button class="inspector-tab" data-tab="adjust">Adjust</button>
                <button class="inspector-tab" data-tab="inspector">Inspector</button>
            </div>
            <div id="inspector-content" class="inspector-content">
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2" opacity=".2"/><path d="M24 16v8M24 28v2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".3"/></svg>
                    <p>Import .json or .tgs<br>to begin</p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Footer -->
    <footer id="app-footer">
        Made by <a href="https://t.me/fiscaldev" target="_blank">@fiscaldev</a>
        <span class="footer-sep">·</span>
        SVG export powered by <a href="https://github.com/attikusfinch/lottie-to-svg" target="_blank">lottie-to-svg</a>
    </footer>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
